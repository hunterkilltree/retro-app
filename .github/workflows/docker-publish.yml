name: Test, Build & Push Docker Images

# Publishes to Docker Hub:
#   FE → https://hub.docker.com/r/testfeaturedev/retro-frontend
#   BE → https://hub.docker.com/r/testfeaturedev/retro-backend
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  – Docker Hub account with push access to testfeaturedev/*
#   DOCKERHUB_TOKEN     – Docker Hub access token (Read & Write)
#
# Pushes happen on master/main and on version tags (v1.2.3).
# Pull requests run the tests and build the images, but never push.

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # allows manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_NAMESPACE: testfeaturedev

jobs:
  # ── Backend tests (needs PostgreSQL for the Spring context + Flyway) ─────────
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: retrodb
          POSTGRES_USER: retro
          POSTGRES_PASSWORD: retro_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: retro-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: bash ./gradlew test --no-daemon

  # ── Frontend checks ─────────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retro-fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: retro-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        # Pre-existing lint errors — report them without blocking the release.
        continue-on-error: true

      - name: Unit tests
        run: npm test

  # ── Build & push images ─────────────────────────────────────────────────────
  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./retro-server
            image: retro-backend
          - name: frontend
            context: ./retro-fe
            image: retro-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tags: latest (default branch), sha-<short>, and 1.2.3 / 1.2 for v-tags
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Enables advanced caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs so Gradle / npm deps aren't re-downloaded every time
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
